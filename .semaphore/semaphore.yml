version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
blocks:
  - name: Docker Build
    dependencies: []
    task:
      jobs:
        - name: Docker build
          commands:
            - checkout
            - cd 2-docker-build
            - docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
            - 'docker pull statjana/myapp:latest'
            - 'docker build --cache-from statjana/myapp:latest -t statjana/myapp:$SEMAPHORE_WORKFLOW_ID .'
            - 'docker tag statjana/myapp:$SEMAPHORE_WORKFLOW_ID statjana/myapp:latest'
            - '#docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD'
            - 'docker push statjana/myapp:$SEMAPHORE_WORKFLOW_ID'
            - 'docker push statjana/myapp:latest'
      secrets:
        - name: DOCKER_TATJANA
